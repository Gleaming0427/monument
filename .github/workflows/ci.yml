name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every monument
        run: node scripts/validate.mjs --strict
      - name: Check the scripts and the kit
        run: find kit scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check the automatic scaffold generator
        run: node scripts/scaffold.test.mjs
      - name: Check adaptive architectural geometry
        run: node scripts/geometry.test.mjs
      - name: Check the compact catalogue
        run: node scripts/catalogue.test.mjs
      - name: Check the site tabs share one column
        run: node scripts/site.test.mjs
      - name: Check the translations and the translated site
        run: node scripts/i18n.test.mjs
      - name: Check the buildings against their sources
        run: node scripts/check.mjs
      - name: Check the order of the works against the story
        run: node scripts/chronology.mjs && node scripts/chronology.test.mjs
      - name: Build the site
        run: node scripts/build-site.mjs
      - name: Check that a deploy is one version, in every module URL
        run: node scripts/deploy.test.mjs
      - name: Check golden monument geometry
        run: node scripts/measure.mjs --label golden-geometry-ci --out .artifacts/metrics.jsonl -- node scripts/golden.test.mjs
      - name: Check scan alignment and the scan field
        run: node scripts/scan.test.mjs
      - name: Check the captured layer in a browser
        run: node scripts/capture-layer.test.mjs
      - name: Check continuous masonry, in geometry and in a browser
        run: node scripts/masonry.test.mjs
      - name: Check that every roof has a frame under it, laid first, and none rising through it
        run: node scripts/roof.test.mjs
      - name: Check that no monument moves away from its reference photos
        run: node scripts/silhouette.test.mjs
      - name: Check that windows, arches, doors and dormers stand on the axes of their bays
        run: node scripts/openings.test.mjs
      - name: Check, in every view, that every window, door and dormer is seen and none is covered
        run: node scripts/vision.test.mjs
      - name: Check phone, tablet and desktop layouts
        run: node scripts/measure.mjs --label responsive-ci --out .artifacts/metrics.jsonl -- node scripts/responsive.test.mjs
      - name: Keep P0 measurements and responsive captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monument-p0-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          retention-days: 14
