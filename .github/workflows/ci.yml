name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every monument
        run: node scripts/validate.mjs --strict
      - name: Check the scripts and the kit
        run: for f in kit/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Build the site
        run: node scripts/build-site.mjs
